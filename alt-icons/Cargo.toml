[package]
name = "alt-icons"
description = "A Windows executable that permanently changes its own icon, iOS-style: a closed set declared at build time, switched by name."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/alt-icons"
keywords = ["windows", "icon", "executable", "win32"]
categories = ["os::windows-apis"]

[features]
build = ["dep:embed-resource"]

[dependencies]
embed-resource = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
